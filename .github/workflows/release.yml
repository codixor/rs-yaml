name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      required: ${{ steps.release.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py

  publish:
    needs: [checks, plan]
    if: needs.plan.outputs.required == 'true'
    environment: cratesio
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: cratesio-rs-yaml-${{ needs.plan.outputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Recheck after the environment wait and any other publisher for this version.
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py
      - name: Publish the checked-out version
        if: steps.release.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --registry crates-io
      - name: Create the GitHub tag and release
        if: steps.release.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TARGET: ${{ steps.release.outputs.target }}
        shell: bash
        run: |
          flags=()
          if [[ "${VERSION%%+*}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" --target "$TARGET" --title "rs-yaml $VERSION" \
            --notes "[rs-yaml $VERSION on crates.io](https://crates.io/crates/rs-yaml/$VERSION)" \
            --generate-notes "${flags[@]}"
