[package]
name = "rs-yaml"
version.workspace = true
edition = "2024"
rust-version = "1.100"
description = "YAML parsing, emission, formatting and source-aware diagnostics"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/codixor/rs-yaml"
keywords = ["yaml", "parser", "emitter", "config"]
categories = ["parsing", "encoding"]

[features]
default = ["streaming"]
streaming = []
serde = ["dep:serde_core", "dep:serde-saphyr"]
arena = ["streaming", "fast-yaml-core/arena"]
lint = ["dep:fast-yaml-linter"]
parallel = ["dep:fast-yaml-parallel"]

[dependencies]
rs-format = "0.1.1"
indexmap = "2.14.2"
serde_core = { version = "1.0.229", optional = true }
serde-saphyr = { version = "2.2.0", default-features = false, features = ["serialize", "deserialize"], optional = true }
fast-yaml-core.workspace = true
fast-yaml-linter = { workspace = true, optional = true, features = ["all-formats"] }
fast-yaml-parallel = { workspace = true, optional = true }
ordered-float = "5.5.1"
saphyr = "0.4.0"
saphyr-parser.workspace = true
thiserror = "2.0.21"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }
indoc = "2.0.8"
pretty_assertions = "1.4.1"

[[bench]]
name = "yaml_core"
harness = false

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
overflow-checks = true

[workspace]
resolver = "3"
members = ["crates/fast-yaml-core", "crates/fast-yaml-linter", "crates/fast-yaml-parallel"]
exclude = ["fuzz"]

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codixor/rs-yaml"

[workspace.dependencies]
fast-yaml-core = { package = "codixor-fast-yaml-core", version = "=0.6.0", path = "crates/fast-yaml-core" }
fast-yaml-linter = { package = "codixor-fast-yaml-linter", version = "=0.6.0", path = "crates/fast-yaml-linter" }
fast-yaml-parallel = { package = "codixor-fast-yaml-parallel", version = "=0.6.0", path = "crates/fast-yaml-parallel" }
bumpalo = { version = "3.20" }
exacl = { version = "0.13" }
ignore = { version = "0.4" }
indexmap = { version = "2" }
memchr = { version = "2.8" }
rayon = { version = "1.12" }
regex = { version = "1.13" }
rustix = { version = "1.1", default-features = false }
saphyr-parser = "0.4.0"
serde = { version = "1.0" }
serde_json = { version = "1.0" }
serde_norway = { version = "0.9" }
serde_path_to_error = { version = "0.1" }
thiserror = { version = "2.0" }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
windows-sys = { version = "0.61.2" }
xattr = { version = "1.7" }
criterion = { version = "0.8" }
indoc = { version = "2.0" }
jsonschema = { version = "0.61", default-features = false }
peak_alloc = { version = "0.3" }
proptest = { version = "1.12" }
tempfile = { version = "3.27" }

[workspace.lints.rust]
# Use "deny" instead of "forbid" to allow local #[allow(unsafe_code)] where necessary
# Unsafe code is still denied by default but can be explicitly allowed with documentation
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Lint groups with lower priority so individual lints can override
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Allow specific patterns (higher priority overrides groups)
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Restriction lint kept workspace-wide so the FFI crates keep documenting every unsafe block
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"
