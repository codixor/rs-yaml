[package]
name = "rs-yaml-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
libfuzzer-sys = "0.4.13"
rs-yaml = { version = "0.5", path = "..", features = ["arena", "lint", "serde"] }

[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format"
path = "fuzz_targets/format.rs"
test = false
doc = false
bench = false
